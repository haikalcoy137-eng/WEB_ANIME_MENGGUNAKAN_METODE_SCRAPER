<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0c11" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="AniKita - jelajahi anime terbaru, cari judul favoritmu, dan tonton episode dengan pengalaman seperti aplikasi mobile."
    />

    <!-- PWA / mobile web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AniKita" />

    <title>AniKita — Anime Streaming</title>

    <style>
      /* Splash screen sederhana (PRD 27) - hilang otomatis setelah React mount */
      html,
      body {
        margin: 0;
        background: #0a0c11;
        color: #f4f6fb;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 18px;
        grid-auto-flow: row;
        align-content: center;
        background: radial-gradient(120% 90% at 50% 0%, #171d2b 0%, #0a0c11 65%);
        z-index: 999;
        transition: opacity 260ms ease;
      }
      #splash[data-hidden="true"] {
        opacity: 0;
        pointer-events: none;
      }
      #splash .mark {
        width: 74px;
        height: 74px;
        border-radius: 22px;
        background: #ff3f6c;
        display: grid;
        place-items: center;
        box-shadow: 0 18px 40px rgba(255, 63, 108, 0.32);
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      #splash .mark::before {
        content: "";
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 12px 0 12px 20px;
        border-color: transparent transparent transparent #0a0c11;
        margin-left: 5px;
      }
      #splash .name {
        font-size: 17px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #b3bccd;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.06);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <div class="mark" aria-hidden="true"></div>
        <div class="name">AniKita</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
